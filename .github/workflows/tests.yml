name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # without: proves CCC stands alone (CNS is optional).
        # with: runs the CNS connector tests, and fails if CNS is missing
        # instead of skipping them.
        cns: ["without", "with"]
    name: test (py${{ matrix.python-version }}, ${{ matrix.cns }} CNS)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff==0.15.22
          # CCCb: the plugged-in text matcher. Required by the matching tests;
          # installed here so they fail, not skip, if it cannot be found.
          python -m pip install -e '.[match]'
      - name: Authorise reads of private CNS (with-CNS job only)
        # CNS is a private repo. The job's own token can read only this repo,
        # so the library's fine-grained read token (Contents: read, the same
        # LIBRARY_READ_TOKEN secret GSA-815, ghost_tools, observe-perceive and
        # sentinel_os use) is applied to the CNS URLs only, in both spellings
        # the library pins. A missing secret fails here, by name.
        if: matrix.cns == 'with'
        env:
          LIBRARY_READ_TOKEN: ${{ secrets.LIBRARY_READ_TOKEN }}
        run: |
          if [ -z "$LIBRARY_READ_TOKEN" ]; then
            echo "::error::LIBRARY_READ_TOKEN secret is not set; private CNS cannot be fetched"
            exit 1
          fi
          for name in CNS cns; do
            git config --global url."https://x-access-token:${LIBRARY_READ_TOKEN}@github.com/wking53214/${name}".insteadOf "https://github.com/wking53214/${name}"
          done
      - name: Install CNS (with-CNS job only, pinned by the [cns] extra)
        if: matrix.cns == 'with'
        run: python -m pip install -e '.[match,cns]'
      - name: Test
        env:
          CCC_REQUIRE_CNS: ${{ matrix.cns == 'with' && '1' || '0' }}
        run: python -m pytest -q
      - name: Lint (hard gate)
        run: ruff check .
