name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff==0.15.22
          # CCCb: the plugged-in text matcher. Required by the matching tests;
          # installed here so they fail, not skip, if it cannot be found.
          python -m pip install -e '.[match]'
      - name: Test
        run: python -m pytest -q
      - name: Lint (hard gate)
        run: ruff check .
